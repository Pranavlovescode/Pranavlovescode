name: Generate pacman animation

on:
  schedule:        # Execute every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: List output files for debugging
        run: find . -type f

      - name: Prepare dist directory & Copy SVG if exists
        run: |
          mkdir -p dist
          if [ -f pacman-contribution-graph/dist/pacman-contribution-graph.svg ]; then
            cp pacman-contribution-graph/dist/pacman-contribution-graph.svg dist/
          elif [ -f dist/pacman-contribution-graph.svg ]; then
            # Already in dist, nothing to do
            echo "SVG found in dist/"
          else
            echo "SVG not found! Check output above." && exit 1
          fi

      - name: Push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
